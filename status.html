<script>
const sb=SirFisherSupabase;
const esc=SirFisherDOM.escapeHTML;
const diasCargaEmDia=()=>Math.max(0,Math.trunc(window.SirFisherApp.number('carga_dias_em_dia',2)));
const diasCargaAtencao=()=>Math.max(diasCargaEmDia()+1,Math.trunc(window.SirFisherApp.number('carga_dias_atencao',5)));
function fmtDate(value){return value?new Date(value).toLocaleString('pt-BR',{dateStyle:'short',timeStyle:'short'}):'—';}
function fmtDay(value){if(!value)return'—';return new Date(`${value}T12:00:00`).toLocaleDateString('pt-BR');}
function statusInfo(value){if(value==='em dia')return['Em dia','ok'];if(value==='atenção')return['Atenção','warn'];if(value==='encerrada')return['Encerrada','neutral'];return[value==='atrasada'?'Atrasada':'Sem carga','bad'];}
function esperar(ms){return new Promise(resolve=>setTimeout(resolve,ms));}
const FONTES_INTEGRACAO={stone_recebiveis:'Recebíveis Stone',stone_pix:'Pix Stone',stone_vendas:'Vendas Stone',saipos_vendas:'Vendas Saipos',saipos_cancelamentos:'Cancelamentos Saipos'};
const DIAS_INTEGRACAO=7;
function isoDia(data){return `${data.getFullYear()}-${String(data.getMonth()+1).padStart(2,'0')}-${String(data.getDate()).padStart(2,'0')}`;}
const GITHUB='https://github.com/';
function linkExecucao(url){return url&&url.startsWith(GITHUB)?`<a href="https://github.com/${esc(url.slice(GITHUB.length))}" target="_blank" rel="noopener">ver no GitHub</a>`:'—';}

// O registrador grava uma rodada Saipos inteira na mesma transação: data/hora
// exata + origem + link distinguem inclusive reexecuções do mesmo run no GitHub.
// Agrupar antes de limitar evita que os sete dias escondam as outras fontes.
function agruparExecucoesIntegracao(rows){
  const saida=[],saipos=new Map();
  rows.forEach((row,indice)=>{
    if(!['saipos_vendas','saipos_cancelamentos'].includes(row.fonte)){
      saida.push({...row,itens:[row],saipos:false});return;
    }
    const instante=row.executado_em||`sem-data:${row.id||indice}`;
    const chave=JSON.stringify([row.origem||'manual',row.execucao_url||'',instante]);
    let grupo=saipos.get(chave);
    if(!grupo){grupo={...row,itens:[],saipos:true};saipos.set(chave,grupo);saida.push(grupo);}
    grupo.itens.push(row);
  });
  return saida.map(grupo=>{
    if(!grupo.saipos)return grupo;
    const dias=[...new Set(grupo.itens.map(r=>r.dia_referencia).filter(Boolean))].sort();
    const erros=grupo.itens.filter(r=>r.situacao==='erro');
    const somar=fonte=>{
      const valores=grupo.itens.filter(r=>r.fonte===fonte&&r.linhas_novas!=null).map(r=>Number(r.linhas_novas)).filter(Number.isFinite);
      return valores.length?valores.reduce((a,b)=>a+b,0):null;
    };
    return {...grupo,dias,
      situacao:erros.length?'erro':grupo.itens.every(r=>r.situacao==='sem_movimento')?'sem_movimento':'ok',
      dias_erro:new Set(erros.map(r=>r.dia_referencia).filter(Boolean)).size,
      vendas_novas:somar('saipos_vendas'),para_justificar:somar('saipos_cancelamentos'),
    };
  });
}

function resultadoIntegracao(row){
  const label=row.situacao==='ok'?'OK':row.situacao==='sem_movimento'?'Sem movimento':'Erro';
  return `<span class="status ${row.situacao==='erro'?'bad':'ok'}">${label}</span>`;
}

function resumoIntegracao(row){
  const numero=valor=>valor==null?'—':Number(valor).toLocaleString('pt-BR');
  if(!row.saipos){
    const valor=numero(row.linhas_novas);
    if(row.linhas_novas==null)return'—';
    return row.fonte==='saipos_cancelamentos'?`${valor} para justificar`:`${valor} ${Number(row.linhas_novas)===1?'linha nova':'linhas novas'}`;
  }
  const partes=[];
  if(row.itens.some(r=>r.fonte==='saipos_vendas'))partes.push(`${numero(row.vendas_novas)} ${row.vendas_novas===1?'venda nova':'vendas novas'}`);
  // O importador registra aqui casos que exigem justificativa, não o total
  // de cancelamentos nem novas vendas. Mantê-los separados evita somas falsas.
  if(row.itens.some(r=>r.fonte==='saipos_cancelamentos'))partes.push(`${numero(row.para_justificar)} para justificar`);
  return partes.join('<br>');
}

function renderExecucaoIntegracao(row){
  const fonte=esc(FONTES_INTEGRACAO[row.fonte]||row.fonte);
  if(!row.saipos)return `<tr><td>${fmtDate(row.executado_em)}</td><td>${fonte}</td><td>${fmtDay(row.dia_referencia)}</td><td>${esc(row.stonecode||'—')}</td><td>${resultadoIntegracao(row)}</td><td class="right">${resumoIntegracao(row)}</td><td>${linkExecucao(row.execucao_url)}</td></tr>`;
  const tipos=[];
  if(row.itens.some(r=>r.fonte==='saipos_vendas'))tipos.push('Vendas');
  if(row.itens.some(r=>r.fonte==='saipos_cancelamentos'))tipos.push('Cancelamentos');
  const inicio=row.dias[0],fim=row.dias[row.dias.length-1];
  const periodo=inicio===fim?fmtDay(inicio):`${fmtDay(inicio)} a ${fmtDay(fim)}`;
  const quantidade=`${row.dias.length} ${row.dias.length===1?'dia':'dias'}`;
  const alerta=row.dias_erro?`<span class="integration-meta">${row.dias_erro} ${row.dias_erro===1?'dia com erro':'dias com erro'}</span>`:'';
  const detalhes=row.itens.slice().sort((a,b)=>String(b.dia_referencia).localeCompare(String(a.dia_referencia))||a.fonte.localeCompare(b.fonte))
    .map(item=>`<tr><td>${fmtDay(item.dia_referencia)}</td><td>${esc(FONTES_INTEGRACAO[item.fonte])}</td><td>${resultadoIntegracao(item)}</td><td class="right">${resumoIntegracao(item)}</td><td>${esc(item.mensagem||'—')}</td></tr>`).join('');
  return `<tr><td>${fmtDate(row.executado_em)}</td><td><b>Saipos</b><span class="integration-meta">${tipos.join(' e ')}</span></td><td>${periodo}<span class="integration-meta">${quantidade}</span></td><td>—</td><td>${resultadoIntegracao(row)}${alerta}</td><td class="right">${resumoIntegracao(row)}</td><td>${linkExecucao(row.execucao_url)}</td></tr>
    <tr><td colspan="7"><details class="integration-details"><summary>Ver detalhes por dia (${row.itens.length} registros)</summary><div class="table-wrap"><table class="data-table"><thead><tr><th>Dia</th><th>Fonte</th><th>Resultado</th><th class="right">Resumo</th><th>Observação</th></tr></thead><tbody>${detalhes}</tbody></table></div></details></td></tr>`;
}

// Cada rodada da rotina grava uma linha por fonte, dia e stonecode. Vale a
// tentativa mais recente: um dia que falhou e depois foi importado some da
// lista de pendências. Dia sem nenhuma tentativa também é pendência — é o que
// aparece se a rotina deixar de rodar.
function pendenciasIntegracao(rows){
  // O fechamento próprio é a fonte de completude Stone desde a virada. Erros
  // anteriores continuam no histórico, sem simular uma pendência atual.
  rows=rows.filter(r=>!['stone_recebiveis','stone_vendas','stone_pix'].includes(r.fonte));
  const ultima=new Map();
  rows.forEach(row=>{const chave=`${row.fonte}|${row.dia_referencia}|${row.stonecode||''}`;const atual=ultima.get(chave);if(!atual||row.executado_em>atual.executado_em)ultima.set(chave,row);});
  const pendencias=[...ultima.values()].filter(row=>row.situacao==='erro');
  const grupos=new Map();
  // Só cobra dias a partir do primeiro registrado de cada fonte: antes disso a
  // integração não existia.
  rows.forEach(row=>{const chave=`${row.fonte}|${row.stonecode||''}`;const grupo=grupos.get(chave);if(!grupo||row.dia_referencia<grupo.inicio)grupos.set(chave,{fonte:row.fonte,stonecode:row.stonecode,inicio:row.dia_referencia});});
  const hoje=new Date();
  for(let atraso=1;atraso<=DIAS_INTEGRACAO;atraso++){
    const dia=new Date(hoje.getFullYear(),hoje.getMonth(),hoje.getDate()-atraso);
    // O arquivo do dia anterior só existe a partir das 4h.
    if(atraso===1&&hoje.getHours()<6)continue;
    const iso=isoDia(dia);
    grupos.forEach(({inicio,...grupo})=>{if(iso>=inicio&&!ultima.has(`${grupo.fonte}|${iso}|${grupo.stonecode||''}`))pendencias.push({...grupo,dia_referencia:iso,situacao:'sem execução',mensagem:'A rotina não rodou para este dia.',executado_em:null,execucao_url:null});});
  }
  return pendencias.sort((a,b)=>String(b.dia_referencia).localeCompare(String(a.dia_referencia)));
}

async function loadIntegracoes(){
  const alvo=document.getElementById('integracoes');
  if(!alvo)return;
  const desde=new Date(Date.now()-(DIAS_INTEGRACAO+7)*86400000).toISOString();
  const {data,error}=await sb.from('app_integracao_execucao').select('*').gte('executado_em',desde).order('executado_em',{ascending:false}).limit(1000);
  if(error){alvo.innerHTML='<div class="erro">Não foi possível carregar o registro das integrações.</div>';return;}
  const rows=data||[];
  const pendencias=pendenciasIntegracao(rows);
  const ultima=rows[0];
  const fonte=row=>esc(FONTES_INTEGRACAO[row.fonte]||row.fonte);
  const intro=ultima?`Última execução: ${fmtDate(ultima.executado_em)} (${ultima.origem==='github'?'rotina do GitHub':'manual'}).`:'Nenhuma execução registrada ainda.';
  const linhasPendencias=pendencias.map(row=>`<tr><td><b>${fonte(row)}</b></td><td>${fmtDay(row.dia_referencia)}</td><td>${esc(row.stonecode||'—')}</td><td><span class="status ${row.situacao==='erro'?'bad':'warn'}">${row.situacao==='erro'?'Erro':'Sem execução'}</span></td><td>${esc(row.mensagem||'—')}</td><td>${fmtDate(row.executado_em)}</td><td>${linkExecucao(row.execucao_url)}</td></tr>`).join('');
  const recentes=agruparExecucoesIntegracao(rows).slice(0,20).map(renderExecucaoIntegracao).join('');
  alvo.innerHTML=`<div class="panel-head"><div><h3>Integrações automáticas</h3><div class="hint">${intro} Pendências das demais rotinas nos últimos ${DIAS_INTEGRACAO} dias. Vendas e recebíveis Stone são acompanhados no fechamento acima; execuções antigas permanecem no histórico.</div></div></div>
    <div class="table-wrap"><table class="data-table"><thead><tr><th>Fonte</th><th>Dia</th><th>Stonecode</th><th>Estado</th><th>Motivo</th><th>Última tentativa</th><th>Execução</th></tr></thead><tbody>${linhasPendencias||'<tr><td colspan="7" class="empty">Nenhuma pendência.</td></tr>'}</tbody></table></div>
    <div class="panel-head"><div><h3>Últimas execuções</h3><div class="hint">Saipos aparece uma vez por execução, com vendas e cancelamentos juntos. Abra os detalhes para ver cada dia.</div></div></div>
    <div class="table-wrap"><table class="data-table"><thead><tr><th>Quando</th><th>Fonte</th><th>Dia / período</th><th>Stonecode</th><th>Resultado</th><th class="right">Resumo</th><th>Execução</th></tr></thead><tbody>${recentes||'<tr><td colspan="7" class="empty">Nenhuma execução registrada.</td></tr>'}</tbody></table></div>`;
}

function resumirFechamentoStone(rows){
  const grupos=new Map();
  rows.forEach(row=>{if(!grupos.has(row.dia))grupos.set(row.dia,[]);grupos.get(row.dia).push(row);});
  const dias=[...grupos].sort(([a],[b])=>a.localeCompare(b)).map(([dia,itens])=>({dia,itens,
    concluido:itens.every(r=>r.estado==='concluido'),atrasado:itens.some(r=>r.atrasado),
    erro:itens.some(r=>r.estado==='erro'),faltam:itens.filter(r=>r.estado!=='concluido')}));
  let contiguo=null;
  for(const dia of dias){if(!dia.concluido)break;contiguo=dia.dia;}
  return {dias,contiguo,pendentes:dias.filter(d=>!d.concluido).length};
}

function renderFechamentoStone(rows){
  const resumo=resumirFechamentoStone(rows);
  const nomes={vendas:'Cartão e Pix',recebiveis:'Novas parcelas',baixas:'Baixas de parcelas',painel:'Painel',extrato:'Extrato'};
  const hora=v=>v?new Date(v).toLocaleString('pt-BR',{timeZone:'America/Fortaleza',dateStyle:'short',timeStyle:'short'}):'—';
  const mostrar=resumo.dias.filter((d,i)=>!d.concluido||i>=resumo.dias.length-30).reverse();
  const linhas=mostrar.map(d=>{
    const estado=d.concluido?'Concluído':d.atrasado?'Atrasado':d.erro?'Exige conferência':'Aguardando';
    const classe=d.concluido?'ok':d.atrasado||d.erro?'bad':'warn';
    const itens=d.itens.map(r=>`<tr><td>${esc(nomes[r.etapa]||r.etapa)}${r.identificador?`<span class="integration-meta">${esc(r.identificador)}</span>`:''}</td><td>${esc(r.estado==='concluido'?'Concluído':r.estado==='erro'?'Exige conferência':'Aguardando')}</td><td>${esc(r.mensagem||'—')}</td><td>${hora(r.atualizado_em)}${r.origem_em?`<span class="integration-meta">Origem: ${hora(r.origem_em)}</span>`:''}</td></tr>`).join('');
    const faltam=d.faltam.map(r=>nomes[r.etapa]||r.etapa).filter((v,i,a)=>a.indexOf(v)===i).join(', ');
    return `<tr><td>${fmtDay(d.dia)}</td><td><span class="status ${classe}">${estado}</span></td><td>${d.concluido?'Todas as etapas conferidas.':esc(faltam)}</td></tr><tr><td colspan="3"><details class="integration-details"><summary>Ver etapas de ${fmtDay(d.dia)}</summary><div class="table-wrap"><table class="data-table"><thead><tr><th>Etapa</th><th>Estado</th><th>Observação</th><th>Conferência</th></tr></thead><tbody>${itens}</tbody></table></div></details></td></tr>`;
  }).join('');
  return `<div class="panel-head"><div><h3>Fechamento automático Stone</h3><div class="hint">Dia civil fechado até 23h59 do dia seguinte, no horário de Fortaleza. Voucher e link de pagamento são tratados separadamente.</div></div></div>
    <div class="notice">Conferido sem lacunas até: <b>${resumo.contiguo?fmtDay(resumo.contiguo):'aguardando o primeiro fechamento'}</b>. ${resumo.pendentes} dia(s) com etapas pendentes. Turnos Saipos que incluem a madrugada acompanham os arquivos do dia seguinte.</div>
    <div class="table-wrap"><table class="data-table"><thead><tr><th>Dia</th><th>Fechamento</th><th>O que falta</th></tr></thead><tbody>${linhas||'<tr><td colspan="3" class="empty">Nenhum dia fechado esperado ainda.</td></tr>'}</tbody></table></div>`;
}

async function loadFechamentoStone(){
  const alvo=document.getElementById('fechamentoStone');if(!alvo)return;
  const rows=[];
  try{
    // Paginação também conserva buracos antigos quando o histórico cresce.
    for(let inicio=0;inicio<50000;inicio+=500){
      const {data,error}=await sb.from('app_stone_fechamento').select('*').order('dia').order('etapa').order('identificador').range(inicio,inicio+499);
      if(error)throw error;
      rows.push(...(data||[]));
      if((data||[]).length<500){alvo.innerHTML=renderFechamentoStone(rows);return;}
    }
    throw new Error('histórico excede o limite de consulta');
  }catch(_){alvo.innerHTML='<div class="erro">Não foi possível conferir o fechamento Stone. O estado de conclusão está indisponível.</div>';}
}

async function aguardarRecalculo(id,onWait){
  const limite=Date.now()+120000;
  while(Date.now()<limite){
    await esperar(2000);
    const {data,error}=await sb.rpc('consultar_recalculo_saldo',{p_id:id});
    if(error)return {situacao:'erro',mensagem:error.message};
    if(data&&data.situacao==='concluido')return data;
    if(data&&data.situacao==='erro')return data;
    if(onWait)onWait();
  }
  return {situacao:'processando'};
}

async function loadStatus(){
  const main=document.getElementById('main');
  main.innerHTML='<div class="loading">Analisando cargas…</div>';
  const {data,error}=await sb.from('app_status_cargas').select('*').order('fonte');
  if(error){main.innerHTML='<div class="erro">Não foi possível carregar o status das fontes.</div>';return;}
  // Quem olha esta tela quer ver primeiro o que exige ação, então fonte
  // encerrada vai para o fim da fila. A ordenação não pode vir só do banco: o
  // .order('fonte') do request substitui o ORDER BY da função, foi assim que a
  // 20260818220000 ficou sem efeito na tela.
  const fimDaFila=row=>row.situacao==='encerrada'?1:0;
  const rows=(data||[]).slice().sort((a,b)=>fimDaFila(a)-fimDaFila(b)
    ||String(a.fonte||'').localeCompare(String(b.fonte||''),'pt-BR'));
  const ok=rows.filter(row=>row.situacao==='em dia').length;const warn=rows.filter(row=>row.situacao==='atenção').length;
  // Fonte encerrada continua listada pelo histórico, mas não é cobrada nem
  // contada como problema.
  const encerradas=rows.filter(row=>row.situacao==='encerrada').length;const bad=rows.length-ok-warn-encerradas;
  const emDia=diasCargaEmDia(),atencao=diasCargaAtencao();
  main.innerHTML=`<div class="page-intro"><div><h2>Status do site</h2><p>Cobertura, última importação e atraso das fontes que alimentam o painel.</p></div><button id="reloadStatus" class="button secondary">Atualizar</button></div>
    <div class="summary-grid"><div class="summary-card"><div class="label">Fontes monitoradas</div><div class="value">${rows.length-encerradas}</div></div><div class="summary-card"><div class="label">Em dia</div><div class="value">${ok}</div></div><div class="summary-card"><div class="label">Atenção</div><div class="value">${warn}</div></div><div class="summary-card"><div class="label">Atrasadas/sem carga</div><div class="value">${bad}</div></div></div>
    <div class="notice">Critério configurado: até ${emDia} dia(s) sem nova importação = em dia; de ${emDia+1} a ${atencao} dias = atenção; acima disso = atrasada. Recebíveis podem ter período futuro porque representam agenda.${encerradas?` ${encerradas} fonte(s) encerrada(s) seguem listadas pelo histórico, sem cobrança de carga.`:''}</div>
    <section class="panel"><div class="panel-head"><div><h3>Fontes</h3><div class="hint">A contagem representa linhas disponíveis na origem bruta.</div></div></div><div class="table-wrap"><table class="data-table"><thead><tr><th>Fonte</th><th>Estado</th><th class="right">Linhas</th><th>Cobertura</th><th>Última importação</th><th>Log de carga</th><th class="right">Atraso</th></tr></thead><tbody>${rows.map(row=>{const [label,klass]=statusInfo(row.situacao);return`<tr><td><b>${esc(row.fonte)}</b></td><td><span class="status ${klass}">${label}</span></td><td class="right">${Number(row.linhas||0).toLocaleString('pt-BR')}</td><td>${fmtDay(row.periodo_inicio)} a ${fmtDay(row.periodo_fim)}</td><td>${fmtDate(row.ultima_importacao)}</td><td>${fmtDate(row.ultima_carga)}</td><td class="right">${row.atraso_dias==null?'—':`${row.atraso_dias} dia(s)`}</td></tr>`;}).join('')||'<tr><td colspan="7" class="empty">Nenhuma fonte encontrada.</td></tr>'}</tbody></table></div></section>
    <section class="panel" id="fechamentoStone"><div class="loading">Conferindo fechamento Stone…</div></section>
    <section class="panel" id="integracoes"><div class="loading">Carregando integrações…</div></section>
    <section class="panel"><div class="panel-head"><div><h3>Manutenção do painel</h3><div class="hint">Sincroniza as classificações históricas com o DE-Para, recalcula o saldo projetado do mês atual e atualiza os snapshots de Despesas e Caixa, em sequência. Rode depois de classificar exceções, editar contas recorrentes ou lançar transações, para os números refletirem na hora — senão eles só atualizam na próxima importação.</div></div></div><div class="actions"><button id="atualizarTudo" class="button">Atualizar tudo agora</button><span id="atualizarTudoMsg" class="hint"></span></div></section>`;
  document.getElementById('reloadStatus').addEventListener('click',loadStatus);
  loadIntegracoes();
  loadFechamentoStone();
  const atualizarBtn=document.getElementById('atualizarTudo');
  const atualizarMsg=document.getElementById('atualizarTudoMsg');
  atualizarBtn.addEventListener('click',async()=>{
    atualizarBtn.disabled=true;const original=atualizarBtn.textContent;
    atualizarMsg.style.color='';
    const erros=[];

    atualizarBtn.textContent='Sincronizando…';atualizarMsg.textContent='Aplicando o DE-Para às linhas do histórico ainda sem categoria…';
    const sync=await sb.rpc('sincronizar_historico_de_para');
    if(sync.error)erros.push('histórico: '+sync.error.message);

    atualizarBtn.textContent='Recalculando…';atualizarMsg.textContent='Recalculando o saldo projetado do mês atual…';
    const hoje=new Date();const inicioMes=`${hoje.getFullYear()}-${String(hoje.getMonth()+1).padStart(2,'0')}-01`;
    const recalc=await sb.rpc('solicitar_recalculo_saldo',{p_data_min:inicioMes});
    if(recalc.error)erros.push('saldo: '+recalc.error.message);

    let refresh={data:null,error:null};
    let estado=null;
    if(!recalc.error&&recalc.data&&recalc.data.id){
      atualizarBtn.textContent='Processando…';atualizarMsg.textContent='Recalculando o saldo e atualizando os snapshots em segundo plano…';
      estado=await aguardarRecalculo(recalc.data.id,()=>{atualizarMsg.textContent='A atualização continua em segundo plano…';});
      if(estado.situacao==='erro')erros.push('saldo/painel: '+(estado.mensagem||'erro desconhecido'));
    }else if(!recalc.error){
      // Compatibilidade temporaria com o banco anterior a 20260758000000.
      atualizarBtn.textContent='Atualizando painel…';atualizarMsg.textContent='Atualizando os snapshots de Despesas e Caixa — isso leva alguns segundos…';
      refresh=await sb.rpc('solicitar_refresh_painel');
      if(refresh.error)erros.push('painel: '+refresh.error.message);
    }

    atualizarBtn.disabled=false;atualizarBtn.textContent=original;
    if(erros.length){atualizarMsg.style.color='var(--red)';atualizarMsg.textContent='Concluído com erro(s) — '+erros.join('; ');return;}
    if(estado&&estado.situacao==='processando'){
      atualizarMsg.style.color='var(--green)';atualizarMsg.textContent='✓ Atualização agendada e ainda processando em segundo plano.';return;
    }
    const quando=new Date((estado&&estado.concluido_em)||refresh.data||Date.now()).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
    atualizarMsg.style.color='var(--green)';atualizarMsg.textContent='✓ Atualizado às '+quando+'. '+(sync.data||0)+' linha(s) de histórico classificada(s); saldo projetado, despesas e caixa já refletem os dados atuais.';
  });
}

(async()=>{const auth=await SirFisherAuth.requireRole(sb);if(auth)await loadStatus();})();
</script>
</body>
</html>
