name: Importação diária por API

# Aquisição às 06:10/18:10 de Fortaleza; retomadas internas às11:10/16:10/23:10.
# Cada aquisição permite só um XML e um Pix NUNCA pedidos. Repetições e
# recuperações usam arquivos privados; nunca repetir um pedido reservado.
on:
  schedule:
    - cron: '10 9,21 * * *'
    - cron: '10 2,14,19 * * *'
    - cron: '10 3 * * *' # Verificação às00:10, depois do prazo do dia anterior.
  workflow_dispatch:
    inputs:
      dia:
        description: 'Dia fechado (AAAA-MM-DD); vazio = ontem'
        default: ''
      dry_run:
        description: 'Conferir sem consultar a Stone nem gravar'
        type: boolean
        default: false
      somente_cache:
        description: 'Recuperar somente arquivos já guardados, sem rede bancária'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: importacao-diaria
  cancel-in-progress: false

jobs:
  stone:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      SUPABASE_URL: https://lucpxoynpvogkvzepagi.supabase.co
      STONE_CONCILIACAO_API_KEY: ${{ secrets.STONE_CONCILIACAO_API_KEY }}
      DIA: ${{ inputs.dia }}
      DRY_RUN: ${{ inputs.dry_run || false }}
      SOMENTE_CACHE: ${{ inputs.somente_cache || github.event.schedule == '10 2,14,19 * * *' }}
      SO_SAUDE: ${{ github.event.schedule == '10 3 * * *' }}
      TZ: America/Fortaleza
      PYTHONIOENCODING: utf-8
    steps:
      - name: Segredos cadastrados
        shell: bash
        run: |
          for nome in DATABASE_URL; do
            [ -n "${!nome}" ] || { echo "Segredo $nome não cadastrado"; exit 1; }
          done
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Dependências
        run: python -m pip install -q -r requirements.txt
      - name: Cartão, Pix por webhook e recebíveis
        shell: bash
        run: |
          args=()
          if [ -n "$DIA" ]; then args+=(--dia "$DIA"); fi
          if [ "$DRY_RUN" = "true" ]; then args+=(--dry-run); fi
          if [ "$SOMENTE_CACHE" = "true" ]; then args+=(--somente-cache); else args+=(--recuperar-downloads); fi
          if [ "$SO_SAUDE" = "true" ]; then args+=(--saude); fi
          status=0
          python scripts/importacao/api_stone_rotina.py "${args[@]}" > saida-stone.log 2>&1 || status=$?
          # Log público: não publicar XML, CSV, credenciais ou valores.
          grep -E '^(ERRO|AVISO|STONE_)' saida-stone.log || true
          exit "$status"
