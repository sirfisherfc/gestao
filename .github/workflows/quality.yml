name: Quality gates

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Static quality gates
        run: python scripts/ci/check_project.py --require-node

      - name: Cloudflare robots response verification without network
        run: python -B scripts/cloudflare/test_robots.py

      - name: Google Business Profile holiday exceptions without network
        run: python -B scripts/gbp/test_feriados.py

      - name: Instagram analytics read scope, cache and metric coverage without network
        run: python -B -m unittest discover -s scripts/instagram_analytics -p 'test_*.py'

      - name: Teknisa store product scope, batch writes and read-back without network
        run: node --test scripts/teknisa/test_produtos_loja.mjs

      - name: Status integrations grouped by Saipos execution without network
        run: node scripts/ci/test_status_integracoes.mjs

      - name: Stone closing coverage and pending-day presentation without network
        run: node scripts/ci/test_status_fechamento.mjs

      - name: Importer dry-runs
        run: python scripts/ci/test_importacao.py

      - name: Bank API downloaders without network
        run: python scripts/ci/test_api_bancos.py

      - name: Stone Pix webhook authentication and background delivery without network
        run: node scripts/ci/test_stone_webhook.mjs

      - name: Stone XML and Pix sales mapping without network
        run: python scripts/ci/test_stone_vendas.py

      - name: Stone daily request persistence and cache without network
        run: python scripts/ci/test_stone_rotina.py

      - name: Stone closing recovery and receivable settlements without network
        run: python scripts/ci/test_stone_fechamento.py

      - name: Pluggy connection, pagination and credential protection
        run: |
          python -m pip install -q -r requirements.txt
          python scripts/ci/test_pluggy.py

      - name: New installation safeguards
        run: python scripts/ci/test_implantacao.py

      - name: Safe production-write destination guard
        run: python scripts/ci/test_escrita_segura.py

      - name: Migration catalog checks
        run: python scripts/ci/test_migrations.py

      - name: Access contracts
        run: python scripts/ci/test_access_contracts.py

      - name: Financial and calendar contracts
        run: python scripts/ci/test_financial_contracts.py

      - name: Front-end performance and resilience contracts
        run: python scripts/ci/test_frontend_contracts.py

      - name: Web import partial failure and background update flows
        run: node --test scripts/ci/test_importacao_web.mjs

      - name: DRE presentation and missing-data behavior
        run: node --test scripts/ci/test_dre_apresentacao.mjs

      - name: Improvement board summary, ordering and filters
        run: node --test scripts/ci/test_melhoria_inovacao.mjs

      - name: Recurring bills overdue carryover and original-period settlement
        run: node --test scripts/ci/test_contas_recorrentes.mjs

      - name: Front-end startup in parallel, cross-tab cache, calendar cut and opt-in measurement
        run: node --test scripts/ci/test_desempenho_front.mjs

  import-outbox:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: sirfisher_outbox_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Transactional import in disposable PostgreSQL 15
        env:
          PGHOST: 127.0.0.1
          PGPORT: '5432'
          PGDATABASE: sirfisher_outbox_test
          PGUSER: postgres
        run: python scripts/ci/test_importacao_outbox.py

      - name: Differential parser parity (Python vs PostgreSQL)
        env:
          PGHOST: 127.0.0.1
          PGPORT: '5432'
          PGDATABASE: sirfisher_parsers_test
          PGUSER: postgres
          PARSER_PARITY_DISPOSABLE: '1'
        run: |
          pip install psycopg2-binary
          # Banco proprio e descartavel: o bootstrap cria os parsers do zero e
          # nao reaproveita os objetos do teste de outbox.
          psql -h 127.0.0.1 -U postgres -d postgres \
            -c 'drop database if exists sirfisher_parsers_test' \
            -c 'create database sirfisher_parsers_test'
          python scripts/ci/test_paridade_parsers.py

      - name: Stone receivable settlement transactions in disposable PostgreSQL
        env:
          PGHOST: 127.0.0.1
          PGPORT: '5432'
          PGDATABASE: sirfisher_stone_test
          PGUSER: postgres
          STONE_SQL_DISPOSABLE: '1'
        run: |
          psql -h 127.0.0.1 -U postgres -d postgres -c 'create database sirfisher_stone_test'
          python scripts/ci/test_stone_baixas_sql.py

      - name: Recurring pending periods in disposable PostgreSQL
        env:
          PGHOST: 127.0.0.1
          PGPORT: '5432'
          PGDATABASE: sirfisher_recorrentes_test
          PGUSER: postgres
          RECORRENTES_SQL_DISPOSABLE: '1'
        run: |
          psql -h 127.0.0.1 -U postgres -d postgres \
            -c 'drop database if exists sirfisher_recorrentes_test' \
            -c 'create database sirfisher_recorrentes_test'
          python scripts/ci/test_contas_recorrentes_sql.py

      - name: DRE cascade view executed against real SQL
        env:
          PGHOST: 127.0.0.1
          PGPORT: '5432'
          PGDATABASE: sirfisher_cascata_test
          PGUSER: postgres
          CASCATA_SQL_DISPOSABLE: '1'
        run: |
          psql -h 127.0.0.1 -U postgres -d postgres \
            -c 'drop database if exists sirfisher_cascata_test' \
            -c 'create database sirfisher_cascata_test'
          python scripts/ci/test_cascata_sql.py

      - name: Calendar receivables universe filter
        env:
          PGHOST: 127.0.0.1
          PGPORT: '5432'
          PGDATABASE: sirfisher_calendario_test
          PGUSER: postgres
          CALENDARIO_SQL_DISPOSABLE: '1'
        run: |
          psql -h 127.0.0.1 -U postgres -d postgres \
            -c 'drop database if exists sirfisher_calendario_test' \
            -c 'create database sirfisher_calendario_test'
          python scripts/ci/test_calendario_recebiveis_sql.py

      - name: Inventory counts and closing revisions
        env:
          PGHOST: 127.0.0.1
          PGPORT: '5432'
          PGDATABASE: sirfisher_estoque_test
          PGUSER: postgres
          ESTOQUE_SQL_DISPOSABLE: '1'
        run: |
          psql -h 127.0.0.1 -U postgres -d postgres \
            -c 'drop database if exists sirfisher_estoque_test' \
            -c 'create database sirfisher_estoque_test'
          python scripts/ci/test_estoque_sql.py
