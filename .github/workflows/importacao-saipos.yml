name: Histórico Saipos e conciliação manual

# Em 02/11/2026, o proprietário confirmou que o caixa usa apenas o Teknisa.
# O histórico da Saipos pode ser consultado manualmente por período.
on:
  workflow_dispatch:
    inputs:
      de:
        description: 'Primeiro dia do turno histórico (AAAA-MM-DD)'
        type: string
        required: true
      ate:
        description: 'Último dia do turno histórico (AAAA-MM-DD)'
        type: string
        required: true
      dry_run:
        description: 'Conferir sem gravar no banco'
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: vendas-saipos
  cancel-in-progress: false

jobs:
  vendas:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      SAIPOS_API_TOKEN: ${{ secrets.SAIPOS_API_TOKEN }}
      DATA_DE: ${{ inputs.de }}
      DATA_ATE: ${{ inputs.ate }}
      DRY_RUN: ${{ inputs.dry_run }}
      TZ: America/Fortaleza
      PYTHONIOENCODING: utf-8
    steps:
      - name: Verificar configuracao privada
        shell: bash
        run: |
          for nome in DATABASE_URL SAIPOS_API_TOKEN; do
            [ -n "${!nome}" ] || { echo "Configuracao privada ausente: $nome"; exit 1; }
          done
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Dependencias
        run: python -m pip install -q -r requirements.txt
      - name: Executar período histórico
        shell: bash
        run: |
          [ -n "$DATA_DE" ] && [ -n "$DATA_ATE" ] || { echo 'ERRO: informe o período histórico.'; exit 1; }
          args=(--de "$DATA_DE" --ate "$DATA_ATE")
          if [ "$DRY_RUN" = "true" ]; then args+=(--dry-run); fi
          status=0
          python scripts/importacao/api_saipos_vendas.py "${args[@]}" > saida-saipos.log 2>&1 || status=$?
          # O repositorio e publico: nenhuma venda ou valor financeiro no log.
          grep -E '^(ERRO|AVISO)' saida-saipos.log || true
          if [ "$status" = 0 ]; then
            if [ "$DRY_RUN" = "true" ]; then
              echo 'Conferencia concluida. Nenhum dado foi gravado.'
            else
              echo 'Importacao concluida. Consulte Conciliacao e Status no Gestao.'
            fi
          fi
          exit "$status"
