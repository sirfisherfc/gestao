<body>
<div class="app">
  <header>
    <div class="head-row"><div class="brand"><div class="mark" aria-hidden="true">P</div><div><h1 data-app-nome>Painel</h1><span data-app-subtitulo>Painel de Gestão</span></div></div><div class="head-meta"><div class="unidade">Importar dados</div></div></div>
    <nav class="tabs"><a href="./">Visão Geral</a><a href="vendas.html">Faturamento</a><a href="caixa.html">Caixa</a><a href="dre.html">DRE</a><a href="despesas.html">Despesas</a><a href="conciliacao.html">Conciliação</a><a href="planejamento.html">Planejamento</a><a href="rotinas.html" class="routines">Rotinas</a></nav>

</div>
<script>
const sb=SirFisherSupabase;
const esc=SirFisherDOM.escapeHTML;

// Espelha o REGISTRO/CABECALHOS dos modulos Python (scripts/importacao/). O
// cabecalho e comparado como subconjunto, igual ao detectar_modulo() do
// importar.py: se os cabecalhos obrigatorios da fonte estao no arquivo, e ela.
// Nao normalizamos os nomes de coluna (nem trim): o Python compara o texto cru
// do cabecalho, e o SQL le as chaves com estes mesmos nomes.
//
// "encoding" e a codificacao FIXA que o importador Python usa para cada fonte:
// utf-8 nas Stone (utf-8-sig; o BOM cai sozinho no TextDecoder) e no BS Cash,
// latin-1 no BB. Isso nao e detalhe: o dedup_hash e md5 do texto, entao ler com
// a codificacao errada muda o hash e duplicaria a linha entre a web e o script.
const FONTES=[
  {fonte:'stone_extrato',rotulo:'Extrato Stone',delim:',',encoding:'utf8',cabecalhos:[
    'Movimentação','Tipo','Valor','Saldo antes','Saldo depois','Tarifa','Data',
    'Horário','Situação','Nosso Número','Destino','Destino Documento',
    'Destino Instituição','Destino Agência','Destino Conta','Origem',
    'Origem Documento','Origem Instituição','Origem Agência','Origem Conta','Descrição']},
  {fonte:'stone_vendas',rotulo:'Vendas Stone',delim:';',encoding:'utf8',cabecalhos:[
    'DOCUMENTO','STONECODE','DATA DA VENDA','BANDEIRA','PRODUTO','STONE ID',
    'N DE PARCELAS','VALOR BRUTO','VALOR LIQUIDO','DESCONTO DE MDR',
    'DESCONTO DE ANTECIPACAO','DESCONTO UNIFICADO','N DO CARTAO','MEIO DE CAPTURA',
    'N DE SERIE','ULTIMO STATUS','DATA DO ULTIMO STATUS']},
  {fonte:'stone_recebiveis',rotulo:'Recebíveis Stone',delim:';',encoding:'utf8',cabecalhos:[
    'DOCUMENTO','STONECODE','CATEGORIA','DATA DA VENDA','DATA DE VENCIMENTO',
    'DATA DE VENCIMENTO ORIGINAL','BANDEIRA','PRODUTO','STONE ID','QTD DE PARCELAS',
    'Nº DA PARCELA','VALOR BRUTO','VALOR LÍQUIDO','DESCONTO DE MDR',
    'DESCONTO DE ANTECIPAÇÃO','DESCONTO UNIFICADO','ÚLTIMO STATUS',
    'DATA DO ÚLTIMO STATUS','ENTRADAS BRUTAS','SAÍDAS BRUTAS']},
  {fonte:'bb',rotulo:'Extrato BB',delim:',',encoding:'latin1',cabecalhos:[
    'Data','Lançamento','Detalhes','N° documento','Valor','Tipo Lançamento']},
  {fonte:'bs_cash',rotulo:'Extrato BS Cash',delim:',',encoding:'utf8',cabecalhos:[
    'Data','Dcto.','Operação','Histórico','Favorecido',
    'Créditos (R$)','Débitos (R$)','Saldo (R$)']}
];

let ARQUIVOS=[];
let OCUPADO=false;

// Parser CSV (RFC 4180: aspas, aspas duplicadas, delimitador e quebra dentro de
// campo). Equivale ao csv.reader do Python. Inline de proposito: o site e
// estatico no GitHub Pages e a CSP nao libera CDN de biblioteca.
function parseCSV(texto,delim){
  const linhas=[];let linha=[];let campo='';let aspas=false;let i=0;
  while(i<texto.length){
    const c=texto[i];
    if(aspas){
      if(c==='"'){
        if(texto[i+1]==='"'){campo+='"';i+=2;continue;}
        aspas=false;i++;continue;
      }
      campo+=c;i++;continue;
    }
    if(c==='"'){aspas=true;i++;continue;}
    if(c===delim){linha.push(campo);campo='';i++;continue;}
    if(c==='\r'){i++;continue;}
    if(c==='\n'){linha.push(campo);linhas.push(linha);linha=[];campo='';i++;continue;}
    campo+=c;i++;
  }
  if(campo!==''||linha.length){linha.push(campo);linhas.push(linha);}
  return linhas;
}

function vazia(linha){return linha.length===0||(linha.length===1&&linha[0]==='');}

// Detecta a fonte pelo cabecalho, igual ao dispatcher do Python: nenhum
// candidato ou mais de um e erro, nao chute.
function detectar(texto){
  const cache=new Map();const candidatos=[];
  for(const cfg of FONTES){
    if(!cache.has(cfg.delim))cache.set(cfg.delim,parseCSV(texto,cfg.delim));
    const linhas=cache.get(cfg.delim);
    if(!linhas.length||vazia(linhas[0]))continue;
    const cab=linhas[0];const presentes=new Set(cab);
    if(cfg.cabecalhos.every(h=>presentes.has(h)))candidatos.push({cfg,linhas,cab});
  }
  if(!candidatos.length)throw new Error('nenhum importador reconhece o cabeçalho deste arquivo');
  if(candidatos.length>1)throw new Error('cabeçalho ambíguo, reconhecido por mais de uma fonte');
  return candidatos[0];
}

// Linhas -> objetos por cabecalho, como o csv.DictReader. Campo ausente fica
// fora do objeto; o SQL le com ->> e recebe null, que e o None do Python.
function objetos(linhas,cab){
  const out=[];
  for(let i=1;i<linhas.length;i++){
    const l=linhas[i];
    if(vazia(l))continue;
    const o={};
    for(let j=0;j<cab.length;j++){if(j<l.length)o[cab[j]]=l[j];}
    out.push(o);
  }
  return out;
}

// latin-1 byte a byte, e nao via TextDecoder('iso-8859-1'): o TextDecoder segue
// o WHATWG e trata 0x80-0x9F como windows-1252 (aspas curvas etc.), enquanto o
// latin-1 do Python mapeia byte -> code point 1:1. Num byte dessa faixa os dois
// gerariam textos diferentes — e hashes diferentes.
function decodeLatin1(buf){
  const bytes=new Uint8Array(buf);let s='';
  for(let i=0;i<bytes.length;i+=8192){
    s+=String.fromCharCode.apply(null,bytes.subarray(i,i+8192));
  }
  return s;
}
function decodificar(buf,enc){
  return enc==='latin1'?decodeLatin1(buf):new TextDecoder('utf-8').decode(buf);
}

// Detecta tentando as duas codificacoes (um extrato BB lido como utf-8 vira
// "Lan?amento" e nao casa; um BS Cash lido como latin-1 vira "OperaÃ§Ã£o" e
// tambem nao). Achada a fonte, RE-DECODIFICA na codificacao canonica dela antes
// de montar as linhas, para o texto — e portanto o dedup_hash — bater com o
// Python byte a byte.
async function lerArquivo(file){
  const buf=await file.arrayBuffer();
  let achado=null,erro=null;
  for(const enc of ['utf8','latin1']){
    try{achado=detectar(decodificar(buf,enc));break;}
    catch(e){if(!erro)erro=e;}
  }
  if(!achado)throw erro;
  const linhas=parseCSV(decodificar(buf,achado.cfg.encoding),achado.cfg.delim);
  if(!linhas.length||vazia(linhas[0]))throw new Error('arquivo sem cabeçalho');
  const registros=objetos(linhas,linhas[0]);
  if(!registros.length)throw new Error('arquivo sem linhas de dados');
  return {cfg:achado.cfg,registros};
}

function fmtDia(v){return v?new Date(`${v}T12:00:00`).toLocaleDateString('pt-BR'):'—';}
function num(v){return Number(v||0).toLocaleString('pt-BR');}

function render(){
  const main=document.getElementById('main');
  // Só os que ainda não foram gravados: o render roda a cada arquivo do lote e
  // não pode reabilitar o botão no meio da gravação.
  const pendentes=ARQUIVOS.filter(a=>a.previa&&!a.erro&&!a.resultado);
  main.innerHTML=`
    <div class="page-intro"><div><h2>Importar dados</h2><p>Carrega os relatórios CSV da Stone, do Banco do Brasil e do BS Cash direto por aqui, sem precisar dos scripts na máquina — serve pelo celular ou de qualquer computador. Reenviar um arquivo já importado não duplica nada: as linhas repetidas são ignoradas.</p></div></div>

    <section class="panel"><div class="panel-head"><div><h3>1 · Escolher arquivos</h3><div class="hint">Extrato, Vendas e Recebíveis da Stone, extrato do Banco do Brasil e extrato do BS Cash. A fonte é reconhecida pelo cabeçalho do arquivo — não precisa dizer qual é qual. Pode mandar vários de uma vez.</div></div></div>
      <div id="drop" class="drop-area">
        <b>Arraste os CSV aqui</b>
        <p>ou toque para escolher do aparelho</p>
        <input type="file" id="files" accept=".csv,text/csv" multiple aria-label="Escolher arquivos CSV" ${OCUPADO?'disabled':''}>
      </div>
    </section>

    ${ARQUIVOS.length?`<section class="panel"><div class="panel-head"><div><h3>2 · Conferir</h3><div class="hint">${ARQUIVOS.some(a=>a.resultado)?'Confira a gravação e a atualização de cada arquivo abaixo.':'Nada foi gravado ainda. Esta conferência roda no banco, com as mesmas regras da gravação.'}</div></div></div>
      <div class="table-wrap"><table class="data-table"><thead><tr><th>Arquivo</th><th>Fonte</th><th class="right">Linhas</th><th class="right">Novas</th><th>Período</th><th>Situação</th></tr></thead><tbody>
      ${ARQUIVOS.map(a=>{
        if(a.erro)return `<tr><td class="file-nome"><b>${esc(a.nome)}</b></td><td colspan="5" class="file-erro">${esc(a.erro)}</td></tr>`;
        if(!a.previa)return `<tr><td class="file-nome"><b>${esc(a.nome)}</b></td><td colspan="5" class="hint">Conferindo…</td></tr>`;
        const p=a.previa;
        const estado=a.resultado
          ? estadoArquivo(a)
          : (p.novas>0?`<span class="status ok">Pronto</span>`:`<span class="status warn">Nada novo</span>`);
        const linhaArquivo=`<tr><td class="file-nome"><b>${esc(a.nome)}</b></td><td>${esc(p.fonte)}</td><td class="right">${num(p.linhas)}</td><td class="right">${a.resultado?num(a.resultado.inseridos):num(p.novas)}</td><td>${fmtDia(p.periodo_inicio)} a ${fmtDia(p.periodo_fim)}</td><td>${estado}</td></tr>`;
        const codigos=p.estabelecimentos&&typeof p.estabelecimentos==='object'?Object.entries(p.estabelecimentos):[];
        if(!codigos.length)return linhaArquivo;
        const detalhe=codigos.map(([codigo,linhas])=>`${esc(codigo)}: ${num(linhas)} linha(s)`).join(' · ');
        return linhaArquivo+`<tr><td></td><td colspan="5" class="file-aviso">Códigos Stone encontrados: ${detalhe}. Cada código será associado à conta configurada em Parâmetros.</td></tr>`;
      }).join('')}
      </tbody></table></div>
      <div class="actions" style="margin-top:14px">
        <button id="importar" class="button" ${pendentes.length&&!OCUPADO?'':'disabled'}>Importar ${pendentes.length||''} arquivo(s)</button>
        <button id="limpar" class="button secondary" ${OCUPADO?'disabled':''}>Limpar</button>
        ${ARQUIVOS.some(a=>a.atualizacao?.id&&!['concluido','erro'].includes(a.atualizacao.situacao))?`<button id="consultar" class="button secondary" ${OCUPADO?'disabled':''}>Consultar atualização</button>`:''}
        <span id="msg" class="hint" role="status" aria-live="polite"></span>
      </div>
    </section>`:''}`;

  document.getElementById('files').addEventListener('change',e=>adicionar(e.target.files));
  const drop=document.getElementById('drop');
  ['dragenter','dragover'].forEach(ev=>drop.addEventListener(ev,e=>{e.preventDefault();drop.classList.add('over');}));
  ['dragleave','drop'].forEach(ev=>drop.addEventListener(ev,e=>{e.preventDefault();drop.classList.remove('over');}));
  drop.addEventListener('drop',e=>adicionar(e.dataTransfer.files));
  const btn=document.getElementById('importar');
  if(btn)btn.addEventListener('click',importar);
  const consultar=document.getElementById('consultar');
  if(consultar)consultar.addEventListener('click',consultarAtualizacoes);
  const limpar=document.getElementById('limpar');
  if(limpar)limpar.addEventListener('click',()=>{ARQUIVOS=[];render();});
}

async function adicionar(fileList){
  if(OCUPADO)return;
  const novos=Array.from(fileList||[]).map(f=>({nome:f.name,file:f}));
  if(!novos.length)return;
  ARQUIVOS=ARQUIVOS.concat(novos);
  render();
  for(const a of novos)await conferir(a);
}

// Dry-run: manda as linhas e deixa o banco validar. Nao repetimos a validacao
// aqui no navegador de proposito — o preview tem que ser o mesmo codigo que
// grava, senao ele mente.
async function conferir(a){
  try{
    const {cfg,registros}=await lerArquivo(a.file);
    a.cfg=cfg;a.registros=registros;
    const {data,error}=await sb.rpc('importar_csv_stone',{p_fonte:cfg.fonte,p_linhas:registros,p_dry_run:true});
    if(error)throw new Error(error.message);
    a.previa=data;
  }catch(e){
    a.erro=e.message||String(e);
  }
  render();
}

function aviso(texto,cor){
  const el=document.getElementById('msg');
  if(!el)return;
  el.style.color=cor||'';
  el.textContent=texto;
}

function esperar(ms){return new Promise(resolve=>setTimeout(resolve,ms));}

// Gravar e atualizar sao estados distintos, inclusive quando um lote para.
function estadoArquivo(a){
  if(!a.resultado.inseridos)return '<span class="status warn">Sem linhas novas</span>';
  const situacao=a.atualizacao?.situacao;
  const rotulos={concluido:'Painel atualizado',erro:'Salvo · atualização falhou',
    desconhecido:'Salvo · consulta indisponível',nao_agendado:'Salvo · atualização não confirmada'};
  return `<span class="status ${situacao==='concluido'?'ok':'warn'}">${rotulos[situacao]||'Salvo · atualização pendente'}</span>`;
}

// Todos os IDs compartilham o prazo. Uma consulta que falha nao significa
// falha do worker. O ID fica no arquivo para uma nova consulta, sem reimportar.
async function aguardarRecalculos(arquivos){
  const limite=Date.now()+120000;
  const tarefas=arquivos.filter(a=>a.atualizacao?.id&&!['concluido','erro'].includes(a.atualizacao.situacao));
  tarefas.forEach(a=>a.atualizacao.situacao='pendente');
  while(Date.now()<limite){
    const pendentes=tarefas.filter(a=>['pendente','processando'].includes(a.atualizacao.situacao));
    if(!pendentes.length)return;
    const respostas=await Promise.allSettled(pendentes.map(a=>
      sb.rpc('consultar_recalculo_saldo',{p_id:a.atualizacao.id})));
    respostas.forEach((resposta,i)=>{
      const a=pendentes[i];
      const consulta=resposta.status==='fulfilled'?resposta.value:null;
      const estado=consulta?.data;
      if(!consulta||consulta.error||!['pendente','processando','concluido','erro'].includes(estado?.situacao)){
        a.atualizacao.situacao='desconhecido';
      }else{
        a.atualizacao.situacao=estado.situacao;
      }
    });
    render();
    aviso('Dados salvos. Acompanhando a atualização dos arquivos em segundo plano…');
    if(!tarefas.some(a=>['pendente','processando'].includes(a.atualizacao.situacao)))return;
    await esperar(2000);
  }
}

function resumirImportacao(){
  const salvos=ARQUIVOS.filter(a=>a.resultado);
  const total=salvos.reduce((s,a)=>s+Number(a.resultado.inseridos||0),0);
  const interrompido=ARQUIVOS.some(a=>a.erro);
  const estados=salvos.filter(a=>a.resultado.inseridos>0).map(a=>a.atualizacao?.situacao);
  const partes=[`${total} nova(s) linha(s) com gravação confirmada.`];
  if(interrompido)partes.push('Há arquivo(s) sem importação confirmada. Os anteriores estão salvos; reenviar não duplica.');
  if(estados.includes('erro'))partes.push('A atualização de parte dos dados falhou. Avise o administrador.');
  if(estados.includes('nao_agendado'))partes.push('Não foi possível confirmar o agendamento de parte dos dados. Avise o administrador para solicitar a atualização na tela de Status.');
  if(estados.includes('desconhecido'))partes.push('Não foi possível consultar parte das atualizações. Use "Consultar atualização" para conferir novamente.');
  const pendente=estados.some(s=>!['concluido','erro','nao_agendado','desconhecido'].includes(s));
  if(pendente)partes.push('A atualização continua pendente em segundo plano. Você pode fechar esta página e conferir o painel mais tarde.');
  if(estados.length&&estados.every(s=>s==='concluido'))partes.push('Saldo recalculado e painel atualizado para todos os arquivos salvos.');
  if(!total&&salvos.length)partes.push('Nenhuma tarefa nova foi solicitada; atualizações anteriores podem continuar pendentes.');
  const atencao=interrompido||pendente||estados.some(s=>s!=='concluido');
  aviso(partes.join(' '),atencao?'var(--amber)':'var(--green)');
}

async function consultarAtualizacoes(){
  if(OCUPADO)return;
  OCUPADO=true;render();
  try{
    await aguardarRecalculos(ARQUIVOS);
  }finally{
    OCUPADO=false;render();resumirImportacao();
  }
}

// Banco com outbox: cada resposta ja confirma dados E tarefa, sem segunda
// mutacao. No rollout, contrato antigo (campo ausente) agenda imediatamente
// por arquivo; ainda existe a lacuna entre as duas RPCs nesse banco antigo.
async function importar(){
  if(OCUPADO)return;
  const fila=ARQUIVOS.filter(a=>a.previa&&!a.erro&&!a.resultado);
  if(!fila.length)return;
  OCUPADO=true;render();
  try{
    for(const a of fila){
      aviso(`Gravando ${a.nome}…`);
      try{
        const {data,error}=await sb.rpc('importar_csv_stone',{p_fonte:a.cfg.fonte,p_linhas:a.registros,p_dry_run:false});
        if(error)throw new Error(error.message);
        if(!data||!Number.isInteger(data.inseridos)||data.inseridos<0)throw new Error('Resposta de gravação não reconhecida.');
        a.resultado=data;
      }catch(e){
        a.erro=e.message||'Não foi possível confirmar a gravação.';
        break;
      }
      const data=a.resultado;
      if(data.inseridos>0){
        if(Object.prototype.hasOwnProperty.call(data,'recalculo_id')){
          a.atualizacao=data.recalculo_id
            ? {id:data.recalculo_id,situacao:'pendente'}
            : {situacao:'nao_agendado'};
        }else{
          a.atualizacao={situacao:'nao_agendado'};
          if(data.recalculo_inicio){
            try{
              const rec=await sb.rpc('solicitar_recalculo_saldo',{
                p_data_min:data.recalculo_inicio,p_data_max:data.recalculo_fim||data.recalculo_inicio});
              if(!rec.error&&rec.data?.id)a.atualizacao={id:rec.data.id,situacao:'pendente'};
            }catch(e){/* Dados salvos: falha de agendamento nao vira falha de importacao. */}
          }
        }
      }
      render();
    }
    // Mesmo se um arquivo posterior falhou, acompanhar os que foram salvos.
    await aguardarRecalculos(ARQUIVOS);
  }finally{
    OCUPADO=false;render();resumirImportacao();
  }
}

(async()=>{const auth=await SirFisherAuth.requireRole(sb);if(auth)render();})();
</script>
