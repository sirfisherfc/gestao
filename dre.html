<style>
  header{background:var(--header);color:#fff;position:sticky;top:0;z-index:10;}
  .head-row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px 18px 12px;}
  .tabs{display:flex;gap:1px;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;border-top:1px solid #21465a;}
  .tabs a.routines{margin-left:auto;padding-left:16px;border-left:1px solid #21465a;}
  .alerta{background:#fbf3e0;border:1px solid #e6d6a8;border-radius:11px;padding:11px 13px;font-size:12px;color:#7a5e1e;margin-bottom:14px;display:flex;align-items:center;gap:9px;}
  .alerta svg{width:18px;height:18px;flex-shrink:0;}
  .alerta b{font-weight:700;}
  .scenario-hint{margin:-7px 0 10px;}
  .proj-memoria{margin:-6px 0 18px;padding:9px 12px;border-left:3px solid var(--amber);background:#faf8f1;border-radius:0 7px 7px 0;line-height:1.5;}
  .kpi .value{font-size:23px;font-weight:700;line-height:1.1;letter-spacing:-.5px;}
  .h-wf{height:420px;}.h-marg{height:230px;}
  .tbl{width:100%;border-collapse:collapse;font-size:12.5px;}
  .tbl td{padding:6px 6px;border-bottom:1px solid #f0f0ec;}
  .tbl td.r{text-align:right;font-variant-numeric:tabular-nums;}
  .tbl .ind{padding-left:18px;color:var(--muted);}
  .tbl .sub td{font-weight:700;border-top:1px solid var(--border);background:#fafaf7;}
  .tbl .fin td{font-weight:700;font-size:14px;border-top:2px solid var(--header);}
  .tbl tr:last-child td{border-bottom:0;}
  .legenda{display:flex;gap:16px;flex-wrap:wrap;font-size:11px;color:var(--muted);margin-top:8px;}
  .legenda span{display:flex;align-items:center;gap:6px;}
  .legenda i{width:14px;height:10px;border-radius:2px;display:inline-block;}
  .bench{display:grid;grid-template-columns:1fr;gap:11px;}
  .bench .row{display:flex;align-items:center;gap:10px;}
  .bench .nome{width:120px;font-size:12px;font-weight:500;flex-shrink:0;}
  .bench .track{flex:1;height:22px;background:#f0efe9;border-radius:5px;position:relative;overflow:hidden;}
  .bench .ref{position:absolute;top:0;bottom:0;background:rgba(46,125,91,.14);}
  .bench .fill{position:absolute;top:0;bottom:0;left:0;border-radius:5px;}
  .bench .mk{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--text);}
  .bench .val{width:96px;text-align:right;font-size:12px;font-weight:700;font-variant-numeric:tabular-nums;flex-shrink:0;}
  .bench .refnote{font-size:10px;color:var(--muted);margin-top:2px;}
  @media (max-width:430px){.kpi .value{font-size:20px;}.bench .nome{width:92px;}.bench .val{width:80px;}}
</style>

<script>
const sb=SirFisherSupabase;
const esc=SirFisherDOM.escapeHTML;
const C={header:'#12313F',teal:'#00A6A6',amber:'#D6A84F',green:'#2E7D5B',red:'#C94C4C',muted:'#6B7280',border:'#E5E7EB'};
const param=(chave,padrao)=>window.SirFisherApp.number(chave,padrao);
const MESES=['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
let CHARTS=[],ROWS=[],RESUMO=[],DESP_FIXA=[],DESP_DIRETA=[],ULTIMA=null,CARGAS=[];

const DESC={
  recReal:'Receita classificada na DRE financeira, acumulada até o corte dos dados. Não equivale necessariamente ao faturamento comercial do período.',
  recProj:'Estimativa pela tendência de faturamento comercial bruto usada no Resumo. Sua base difere da receita financeira realizada.',
  mcReal:'Contribuição gerencial: receita financeira menos os grupos classificados como variáveis. Usa despesas registradas; não comprova consumo de estoque.',
  mcProj:'Margem de contribuição estimada: margem já realizada + receita futura − despesa direta futura.',
  opReal:'Subtotal operacional dos lançamentos disponíveis, sem valores futuros. A base financeira não permite interpretá-lo como EBITDA contábil.',
  opProj:'Resultado operacional estimado: realizado + receita futura − despesas diretas e fixas futuras, usando as mesmas premissas do caixa.',
  liqReal:'Total gerencial dos lançamentos, incluindo investimentos e itens não operacionais. Não representa lucro líquido contábil nem saldo disponível para distribuição.',
  liqProj:'Total gerencial estimado: operacional projetado + itens abaixo da operação já registrados. Combina projeção comercial com base financeira; não representa lucro líquido contábil.'
};

function brl(v){if(v==null||isNaN(v))return '—';const a=Math.abs(v);if(a>=1e6)return 'R$ '+(v/1e6).toFixed(2).replace('.',',')+' mi';if(a>=1e3)return 'R$ '+(v/1e3).toFixed(1).replace('.',',')+' mil';return 'R$ '+v.toFixed(0);}
function brlK(v){if(v==null||isNaN(v))return '—';return 'R$ '+Math.round(v/1e3)+'k';}
function rs(v){return v==null?'—':'R$ '+Number(v).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});}
function pp(v){return (v==null||isNaN(v))?'—':v.toFixed(1).replace('.',',')+'%';}
function num(v){
  if(!['number','string'].includes(typeof v)||(typeof v==='string'&&!v.trim()))return null;
  const n=Number(v);return Number.isFinite(n)?n:null;
}
function soma(...valores){return valores.some(v=>num(v)==null)?null:valores.reduce((s,v)=>s+Number(v),0);}
function negativo(v){return num(v)==null?null:-Number(v);}
function margem(v,receita){return num(v)!=null&&num(receita)>0?v/receita*100:null;}
function corResultado(v){return num(v)==null?C.muted:(v>=0?C.green:C.red);}
function ic(p){return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">'+p+'</svg>';}
const ICON={cash:'<path d="M2 7h20v10H2z"/><circle cx="12" cy="12" r="2.5"/>',mc:'<path d="M3 3v18h18"/><path d="M7 15l4-4 3 3 5-6"/>',op:'<path d="M4 19V5M4 19h16M9 16V9M14 16V6M19 16v-4"/>',liq:'<path d="M12 2v20M5 9l7-7 7 7"/>',alert:'<path d="M12 9v4"/><circle cx="12" cy="16.2" r=".4" fill="currentColor"/><path d="M10.3 3.9 1.8 18a1.8 1.8 0 0 0 1.6 2.7h17.2a1.8 1.8 0 0 0 1.6-2.7L13.7 3.9a1.8 1.8 0 0 0-3.4 0z"/>'};

function deltaVal(c,p){if(p==null||c==null)return '<div class="sub">vs mês anterior: —</div>';const d=c-p;return '<div class="sub '+(d>=0?'up':'down')+'"><b>'+(d>=0?'+':'−')+brl(Math.abs(d))+'</b> vs mês anterior</div>';}
function subMarg(perc,prevPerc){
  if(perc==null)return '<div class="sub">—</div>';
  let d='';
  if(prevPerc!=null){const dd=perc-prevPerc;d=' · <span class="'+(dd>=0?'up':'down')+'">'+(dd>=0?'+':'−')+Math.abs(dd).toFixed(1).replace('.',',')+'pp</span>';}
  return '<div class="sub">margem <b>'+pp(perc)+'</b>'+d+'</div>';
}
function kpi(label,iconKey,value,sub,color,descKey,exactValue){
  const exact=exactValue==null?'':' title="Valor exato: '+rs(exactValue)+'"';
  return '<div class="kpi"><span class="bar" style="background:'+color+'"></span>'+
    '<div class="label">'+ic(ICON[iconKey])+'<span class="txt">'+label+'</span>'+
    '<span class="kpi-info" data-desc="'+DESC[descKey]+'">i</span></div>'+
    '<div class="value"'+exact+' style="color:'+(value.includes('-')?C.red:C.header)+'">'+value+'</div>'+(sub||'')+'</div>';
}

function subCenario(perc,label){
  return '<div class="sub">margem <b>'+pp(perc)+'</b> · '+label+'</div>';
}

// seletor de periodo reutilizavel: dois selects dependentes (Ano + Mes)
function montarSeletorPeriodo(anoMesList,selecionado){
  const set=[...new Set(anoMesList)].filter(Boolean).sort();
  if(!set.length)return;
  if(!set.includes(selecionado))selecionado=set[set.length-1];
  const porAno={};set.forEach(am=>{const a=am.slice(0,4);(porAno[a]=porAno[a]||[]).push(am);});
  const anos=Object.keys(porAno).sort((a,b)=>b.localeCompare(a));
  const anoSel=document.getElementById('anoSel'),mesSel=document.getElementById('mesSel');
  anoSel.innerHTML=anos.map(a=>'<option value="'+a+'">'+a+'</option>').join('');
  anoSel.value=selecionado.slice(0,4);
  function fillMeses(ano,alvo){
    const meses=(porAno[ano]||[]).slice().sort((a,b)=>b.localeCompare(a));
    mesSel.innerHTML=meses.map(am=>'<option value="'+am+'">'+MESES[+am.slice(5,7)-1]+'</option>').join('');
    mesSel.value=(alvo&&meses.includes(alvo))?alvo:meses[0];
  }
  fillMeses(anoSel.value,selecionado);
  anoSel.onchange=function(){fillMeses(anoSel.value,null);renderMes(mesSel.value);};
  mesSel.onchange=function(){renderMes(mesSel.value);};
}

let mainAbortController=null;

async function main(){
  if(mainAbortController){try{mainAbortController.abort();}catch(_e){}}
  mainAbortController=typeof AbortController!=='undefined'?new AbortController():null;
  const signal=mainAbortController?.signal;

  try{
    const resilient=(queryFn)=>sb.resilientFetch?sb.resilientFetch(queryFn):queryFn();
    const [r,res,df,dd]=await Promise.allSettled([
      resilient(()=>sb.from('app_painel_dre_cascata').select('*').order('mes',{ascending:true})),
      resilient(()=>sb.from('app_painel_resumo_mensal').select('ano_mes,faturamento,faturamento_proj').order('ano_mes',{ascending:true})),
      resilient(()=>sb.from('app_projecao_despesa_fixa').select('dia,valor')),
      resilient(()=>sb.from('app_projecao_despesa_direta').select('dia,valor'))
    ]);
    if(signal?.aborted)return;

    const val=(result)=>result.status==='fulfilled'?result.value:{data:null,error:result.reason};
    const [rVal,resVal,dfVal,ddVal]=[r,res,df,dd].map(val);

    if(rVal.error)throw rVal.error;
    ROWS=rVal.data||[];
    if(!ROWS.length)throw new Error('Sem dados de DRE.');

    RESUMO=resVal.data||[];
    DESP_FIXA=dfVal.data||[];
    DESP_DIRETA=ddVal.data||[];

    const projParcial=Boolean(resVal.error||dfVal.error||ddVal.error);
    if(projParcial){
      console.warn('Projeções auxiliares temporariamente indisponíveis:',{res:resVal.error,df:dfVal.error,dd:ddVal.error});
    }

    montarSeletorPeriodo(ROWS.map(x=>x.ano_mes), ROWS[ROWS.length-1].ano_mes);
    renderMes(document.getElementById('mesSel').value);
    if(projParcial){
      const alertBox=document.createElement('div');
      alertBox.className='alerta';
      alertBox.innerHTML=ic(ICON.alert)+'<div>Projeções de fechamento temporariamente indisponíveis. Exibindo dados realizados registrados.</div>';
      const mainEl=document.getElementById('main');
      if(mainEl&&mainEl.firstChild)mainEl.insertBefore(alertBox,mainEl.firstChild);
    }
    carregarRodape();
  }catch(e){
    if(signal?.aborted)return;
    document.getElementById('main').innerHTML='<div class="erro">Não foi possível carregar os dados: '+esc(e.message||e)+'</div>';
  }
}

async function carregarRodape(){
  try{
    const [uc,cg]=await Promise.all([
      sb.from('app_painel_ultima_carga').select('ultima'),
      sb.from('app_painel_cargas').select('*').limit(50)
    ]);
    ULTIMA=(!uc.error&&uc.data&&uc.data[0])?uc.data[0].ultima:null;
    CARGAS=cg.error?[]:(cg.data||[]);
    if(ULTIMA){const d=new Date(ULTIMA);document.getElementById('rodapeAtt').textContent='Atualizado em '+String(d.getDate()).padStart(2,'0')+'/'+String(d.getMonth()+1).padStart(2,'0')+'/'+d.getFullYear()+' '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');}
    else{document.getElementById('rodapeAtt').textContent='Atualizado: —';}
    const lista=document.getElementById('cargasLista');
    lista.innerHTML=CARGAS.length?CARGAS.map(c=>'<div style="padding:7px 0;border-bottom:1px solid var(--border)"><b>'+esc(c.quando)+'</b><br><span style="color:var(--muted)">'+esc(c.fontes)+'</span></div>').join(''):'<div style="color:var(--muted)">Ainda sem registros de carga.</div>';
    document.getElementById('rodape').style.display='flex';
  }catch(_error){
    // O rodape e informativo e nao pode atrasar nem apagar a DRE.
  }
}

function renderMes(anoMes){
  CHARTS.forEach(c=>{try{c.destroy()}catch(e){}});CHARTS=[];
  const idx=ROWS.findIndex(r=>r.ano_mes===anoMes);
  const r=ROWS[idx]; const prev=idx>0?ROWS[idx-1]:null;
  if(!r)return;
  const N=k=>num(r[k]);
  const P=k=>num(prev?.[k]);
  const trend=SirFisherFormat.monthTrend(RESUMO,anoMes);
  const somaProj=(rows)=>soma(...rows
    .filter(x=>x.dia&&x.dia.slice(0,7)===anoMes)
    .map(x=>num(x.valor)==null?null:Math.abs(Number(x.valor))));
  // Usa a projeção comercial como receita de fechamento. No começo do mês, a
  // receita financeira reconhecida na DRE fica atrás das vendas e não pode ser
  // a base da extrapolação sem derrubar artificialmente o resultado.
  const receitaProj=trend.active?trend.projected:N('receita');
  const receitaFutura=trend.active?(N('receita')==null?null:Math.max(receitaProj-N('receita'),0)):0;
  const despDiretaFutura=trend.active?somaProj(DESP_DIRETA):0;
  const despFixaFutura=trend.active?somaProj(DESP_FIXA):0;
  const margemContribProj=trend.active
    ? soma(N('margem_contribuicao'),receitaFutura,negativo(despDiretaFutura))
    : N('margem_contribuicao');
  const resultadoOpProj=trend.active
    ? soma(N('resultado_operacional'),receitaFutura,negativo(despDiretaFutura),negativo(despFixaFutura))
    : N('resultado_operacional');
  const abaixoOperacional=soma(N('nao_operacional'),N('contabil'),N('capex'),N('outros'),N('nao_categorizado'));
  const resultadoLiqProj=trend.active?soma(resultadoOpProj,abaixoOperacional):N('resultado_liquido');
  const margemMcProj=margem(margemContribProj,receitaProj);
  const margemOpProj=margem(resultadoOpProj,receitaProj);
  const margemLiqProj=margem(resultadoLiqProj,receitaProj);
  const memoriaProj=trend.active&&resultadoOpProj!=null
    ? '<div class="hint proj-memoria"><b>Memória do resultado operacional projetado:</b> '
      +brl(N('resultado_operacional'))+' realizado + '+brl(receitaFutura)+' receita futura − '
      +brl(despDiretaFutura)+' despesa direta − '+brl(despFixaFutura)+' despesa fixa = <b>'
      +brl(resultadoOpProj)+'</b></div>'
    : (trend.active?'<div class="hint proj-memoria">Projeção operacional indisponível: faltam valores necessários ao cálculo.</div>':'');

  const naoCat=N('nao_categorizado');
  const alertaHtml=Math.abs(naoCat)>0.5
    ? '<div class="alerta">'+ic(ICON.alert)+'<div>Há <b>'+rs(Math.abs(naoCat))+'</b> em lançamentos <b>não categorizados</b> neste mês. Classifique para o resultado ficar preciso.</div></div>'
    : '';

  const html=`
    <div class="section-title">Resultado gerencial de ${MESES[new Date(r.mes).getUTCMonth()]} ${new Date(r.mes).getUTCFullYear()}</div>
    <div class="hint scenario-hint">Base predominantemente financeira. Pagamentos de insumos não são CMV apurado; o total inclui investimentos e itens não operacionais e não equivale a lucro líquido contábil.</div>
    ${alertaHtml}
    <div class="section-title">Lançamentos disponíveis no período</div>
    <div class="hint scenario-hint">Valores registrados até o corte, sem projeções. A completude das fontes não está confirmada; — indica valor indisponível.</div>
    <div class="kpis">
      ${kpi('Receita financeira registrada','cash',brl(N('receita')),deltaVal(N('receita'),P('receita')),C.header,'recReal',N('receita'))}
      ${kpi('Margem de contribuição realizada','mc',brl(N('margem_contribuicao')),subMarg(N('mc_perc'),P('mc_perc')),C.teal,'mcReal',N('margem_contribuicao'))}
      ${kpi('Operacional gerencial registrado','op',brl(N('resultado_operacional')),subMarg(N('margem_op_perc'),P('margem_op_perc')),corResultado(N('resultado_operacional')),'opReal',N('resultado_operacional'))}
      ${kpi('Total gerencial registrado','liq',brl(N('resultado_liquido')),subMarg(N('margem_liq_perc'),P('margem_liq_perc')),corResultado(N('resultado_liquido')),'liqReal',N('resultado_liquido'))}
    </div>
    ${trend.active?`
      <div class="section-title">Projeção de fechamento</div>
      <div class="hint scenario-hint">Combina tendência de faturamento comercial com lançamentos financeiros. As bases diferem; esta estimativa não é lucro apurado.</div>
      <div class="kpis">
        ${kpi('Receita de vendas projetada','cash',brl(receitaProj),'<div class="sub">fechamento estimado pela tendência</div>',C.header,'recProj',receitaProj)}
        ${kpi('Margem de contribuição projetada','mc',brl(margemContribProj),subCenario(margemMcProj,'fechamento estimado'),C.teal,'mcProj',margemContribProj)}
        ${kpi('Operacional gerencial projetado','op',brl(resultadoOpProj),subCenario(margemOpProj,'fechamento estimado'),corResultado(resultadoOpProj),'opProj',resultadoOpProj)}
        ${kpi('Total gerencial projetado','liq',brl(resultadoLiqProj),subCenario(margemLiqProj,'fechamento estimado'),corResultado(resultadoLiqProj),'liqProj',resultadoLiqProj)}
      </div>
      ${memoriaProj}
    `:''}

    <div class="section-title">Cascata realizada até o corte</div>
    <div class="card">
      <h3>Da receita ao total gerencial registrado</h3>
      <div class="hint">Não inclui a projeção de fechamento · cada barra mostra quanto soma (verde) ou consome (vermelho)</div>
      <div class="chart-wrap h-wf"><canvas id="wf"></canvas></div>
      <div class="legenda">
        <span><i style="background:${C.header}"></i>Subtotal</span>
        <span><i style="background:${C.green}"></i>Entra</span>
        <span><i style="background:${C.red}"></i>Consome</span>
      </div>
    </div>

    <div class="card">
      <h3>DRE gerencial até o corte</h3>
      <div class="hint">Lançamentos disponíveis e % sobre a receita financeira registrada</div>
      <div id="dreTbl"></div>
    </div>

    <div class="section-title">Saúde de custos</div>
    <div class="card">
      <h3>Custos registrados e faixas configuradas</h3>
      <div class="hint">Base: receita financeira da DRE. Faixas de acompanhamento interno; não são referências universais de mercado. Inventário e custo completo de pessoal não estão confirmados.</div>
      <div id="bench"></div>
    </div>

    <div class="section-title">Tendência</div>
    <div class="card">
      <h3>Evolução das margens</h3>
      <div class="hint">Contribuição, operacional e total gerencial em % da receita financeira, mês a mês</div>
      <div class="chart-wrap h-marg"><canvas id="marg"></canvas></div>
      <div class="legenda">
        <span><i style="background:${C.teal}"></i>Contribuição</span>
        <span><i style="background:${C.amber}"></i>Operacional</span>
        <span><i style="background:${C.green}"></i>Total gerencial</span>
      </div>
    </div>
  `;
  document.getElementById('main').innerHTML=html;

  drawWaterfall(r);
  drawTabela(r);
  drawBench(r);
  drawMargens();
}

Chart.defaults.font.family="'Roboto',Arial,sans-serif";Chart.defaults.color=C.muted;

function drawWaterfall(r){
  const N=k=>num(r[k]);
  const campos=['receita','cmv','impostos','margem_contribuicao','pessoal',
    'infraestrutura','marketing','resultado_operacional','nao_operacional',
    'contabil','capex','outros','nao_categorizado','resultado_liquido'];
  if(campos.some(k=>N(k)==null)){
    const box=document.getElementById('wf').parentElement;
    box.className='chart-wrap';
    box.innerHTML='<p class="hint">Cascata indisponível: faltam valores de um ou mais componentes. Consulte os valores disponíveis na tabela.</p>';
    return;
  }
  const mc=N('margem_contribuicao'), ro=N('resultado_operacional'), rl=N('resultado_liquido');
  const steps=[];
  steps.push({label:'Receita',base:0,end:N('receita'),total:true});
  let run=N('receita');
  [['Insumos pagos','cmv'],['Impostos s/ venda','impostos']].forEach(([lab,k])=>{const v=N(k);if(Math.abs(v)>0.5){steps.push({label:lab,base:run,end:run+v});run+=v;}});
  steps.push({label:'Margem contribuição',base:0,end:mc,total:true});
  run=mc;
  [['Pessoal','pessoal'],['Infraestrutura','infraestrutura'],['Marketing','marketing']].forEach(([lab,k])=>{const v=N(k);if(Math.abs(v)>0.5){steps.push({label:lab,base:run,end:run+v});run+=v;}});
  steps.push({label:'Resultado operac.',base:0,end:ro,total:true,fin:true});
  run=ro;
  [['Não operacional','nao_operacional'],['Contábil','contabil'],['Investim. (CAPEX)','capex'],['Outros','outros'],['Não categorizado','nao_categorizado']].forEach(([lab,k])=>{const v=N(k);if(Math.abs(v)>0.5){steps.push({label:lab,base:run,end:run+v});run+=v;}});
  steps.push({label:'Total gerencial',base:0,end:rl,total:true,fin:true});

  const cor=s=>{ if(s.total){ return s.fin?(s.end>=0?C.green:C.red):C.header; } return s.end>=s.base?C.green:C.red; };

  CHARTS.push(new Chart(document.getElementById('wf'),{type:'bar',
    data:{labels:steps.map(s=>s.label),datasets:[{data:steps.map(s=>[s.base,s.end]),backgroundColor:steps.map(cor),borderRadius:3,borderSkipped:false}]},
    options:{indexAxis:'y',responsive:true,maintainAspectRatio:false,
      plugins:{legend:{display:false},tooltip:{callbacks:{label:c=>{const s=steps[c.dataIndex];const v=s.total?s.end:(s.end-s.base);return ' '+(s.total?'':(v>=0?'+':'−'))+brl(Math.abs(v));}}}},
      scales:{x:{grid:{color:C.border},ticks:{callback:v=>brlK(v),font:{size:10}}},y:{grid:{display:false},ticks:{font:{size:11},color:C.text,autoSkip:false}}}}}));
}

function drawTabela(r){
  const N=k=>num(r[k]);
  const rec=N('receita');
  const pc=v=>pp(margem(v,rec));
  const line=(lab,v,cls,ind)=>'<tr class="'+(cls||'')+'"><td'+(ind?' class="ind"':'')+'>'+lab+'</td><td class="r">'+rs(v)+'</td><td class="r" style="color:var(--muted)">'+pc(v)+'</td></tr>';
  const detalhe=(lab,k)=>N(k)==null||Math.abs(N(k))>0.5?line(lab,N(k),'',true):'';
  let h='<table class="tbl">';
  h+=line('Receita financeira registrada',rec,'sub');
  h+=detalhe('Insumos pagos (despesa direta)','cmv');
  h+=detalhe('Impostos sobre venda','impostos');
  h+=line('= Margem de contribuição',N('margem_contribuicao'),'sub');
  h+=detalhe('Pessoal','pessoal');
  h+=detalhe('Infraestrutura','infraestrutura');
  h+=detalhe('Marketing','marketing');
  h+=line('= Resultado operacional',N('resultado_operacional'),'sub');
  h+=detalhe('Não operacional','nao_operacional');
  h+=detalhe('Contábil','contabil');
  h+=detalhe('Investimentos (CAPEX)','capex');
  h+=detalhe('Outros grupos','outros');
  h+=detalhe('⚠️ Não categorizado','nao_categorizado');
  h+=line('= Total gerencial',N('resultado_liquido'),'fin');
  h+='</table>';
  document.getElementById('dreTbl').innerHTML=h;
}

function drawBench(r){
  const N=k=>num(r[k]);
  const cmv=N('receita')>0&&N('cmv')!=null?N('cmv_perc'):null;
  const pes=N('receita')>0&&N('pessoal')!=null?N('pessoal_perc'):null;
  const prime=soma(cmv,pes);
  // [valor, refMin, refMax, escalaMax, nota]
  const items=[
    ['Insumos pagos','cmv',cmv,param('dre_cmv_referencia_min',28),param('dre_cmv_referencia_max',35),60,'Despesa direta registrada; não é consumo de estoque apurado'],
    ['Pessoal registrado','pes',pes,param('dre_pessoal_referencia_min',25),param('dre_pessoal_referencia_max',35),60,'Pessoal classificado na DRE; cobertura de encargos e provisões não confirmada'],
    ['Prime Cost (aprox.)','prime',prime,param('dre_prime_cost_referencia_min',55),param('dre_prime_cost_referencia_max',65),100,'Insumos pagos + pessoal registrado, em % da receita financeira']
  ];
  const corVal=(v,lo,hi)=>v==null?C.muted:(v<=hi?C.green:(v<=hi+8?C.amber:C.red));
  let h='<div class="bench">';
  items.forEach(([nome,key,val,lo,hi,esc,nota])=>{
    const v=val==null?0:val;
    const cor=corVal(val,lo,hi);
    const refL=lo/esc*100, refW=(hi-lo)/esc*100, fillW=Math.max(0,Math.min(v/esc*100,100));
    h+='<div><div class="row"><div class="nome">'+nome+'</div>'+
       '<div class="track">'+(val==null?'':'<div class="ref" style="left:'+refL+'%;width:'+refW+'%"></div>'+
       '<div class="fill" style="width:'+fillW+'%;background:'+cor+';opacity:.85"></div>')+'</div>'+
       '<div class="val" style="color:'+cor+'">'+(val==null?'Indisponível':pp(val))+'</div></div>'+
       '<div class="refnote">'+nota+(val==null?' · falta custo ou receita válida':' · faixa configurada: '+pp(lo)+' a '+pp(hi))+'</div></div>';
  });
  h+='</div>';
  document.getElementById('bench').innerHTML=h;
}

function drawMargens(){
  const labels=ROWS.map(x=>{const d=new Date(x.mes);return MESES[d.getUTCMonth()].slice(0,3)+'/'+String(d.getUTCFullYear()).slice(2);});
  const ds=(k,cor)=>({label:k,data:ROWS.map(x=>num(x[k])),borderColor:cor,backgroundColor:cor,borderWidth:2,pointRadius:0,tension:.2,spanGaps:false});
  CHARTS.push(new Chart(document.getElementById('marg'),{type:'line',
    data:{labels,datasets:[ds('mc_perc',C.teal),ds('margem_op_perc',C.amber),ds('margem_liq_perc',C.green)]},
    options:{responsive:true,maintainAspectRatio:false,interaction:{mode:'index',intersect:false},
      plugins:{legend:{display:false},tooltip:{callbacks:{label:c=>c.parsed.y==null?null:' '+({mc_perc:'Contribuição',margem_op_perc:'Operacional',margem_liq_perc:'Total gerencial'})[c.dataset.label]+': '+pp(c.parsed.y)}}},
      scales:{y:{grid:{color:C.border},ticks:{callback:v=>v+'%',font:{size:10}}},x:{grid:{display:false},ticks:{font:{size:9},maxRotation:0,autoSkip:true,maxTicksLimit:10}}}}}));
}

const tip=document.getElementById('tip');
document.addEventListener('click',e=>{
  const info=e.target.closest('.kpi-info');
  if(info){e.stopPropagation();tip.textContent=info.getAttribute('data-desc');tip.style.display='block';
    const r=info.getBoundingClientRect();let left=r.left+window.scrollX-20;
    const maxLeft=window.scrollX+document.documentElement.clientWidth-tip.offsetWidth-8;
    if(left>maxLeft)left=maxLeft; if(left<8)left=8;
    tip.style.left=left+'px';tip.style.top=(r.bottom+window.scrollY+8)+'px';
    tip.style.setProperty('--ax',(r.left+window.scrollX-left)+'px');
  }else if(!e.target.closest('#tip')){tip.style.display='none';}
});
window.addEventListener('scroll',()=>tip.style.display='none');
const cargasBox=document.getElementById('cargasBox');
document.getElementById('verCargas').addEventListener('click',e=>{e.preventDefault();cargasBox.style.display='flex';});
document.getElementById('fecharCargas').addEventListener('click',()=>cargasBox.style.display='none');
cargasBox.addEventListener('click',e=>{if(e.target===cargasBox)cargasBox.style.display='none';});

(async()=>{const ctx=await SirFisherAuth.requireRole(sb);if(ctx)main();})();
</script>
